sportybet:
  url: https://www.sportybet.com/ng/m/games/ping-pong
collector:
  user_data_dir: ./browser_profile
  mode: websocket
  headless: true
  websocket_url_contains: /ws/ng/games/ping-pong/
  websocket_message_type: ROUND_COEFFICIENT
  feed_url_contains: ''
  json_items_path: data
  round_id_field: id
  multiplier_field: houseCoefficient
  timestamp_field: createdAt
  dom_history_item_selector: ''
  dom_round_id_attribute: ''
  dom_multiplier_selector: ''
storage:
  sqlite_path: ./data/pingpong.sqlite3
features:
  max_lag: 80
  rolling_windows:
  - 5
  - 10
  - 20
  - 50
  - 100
  - 250
  distribution_thresholds:
  - 1.1
  - 1.2
  - 1.3
  - 1.5
  - 2.0
  - 3.0
  - 5.0
  - 10.0
  - 20.0
model:
  min_rounds: 3000
  train_fraction: 0.65
  validation_fraction: 0.2
  calibration_splits: 3
  thresholds:
  - 1.1
  - 1.2
  - 1.3
  - 1.5
  - 2.0
  - 3.0
  - 5.0
  - 10.0
  - 20.0
  candidates:
    logistic: true
    hist_gradient_boosting: true
    extra_trees: true
  min_relative_logloss_improvement: 0.005
  min_auc: 0.515
  min_brier_improvement: 0.001
  min_test_samples: 300
  ensemble_temperature: 0.02
diagnostics:
  autocorr_lags: 40
  drift_reference_window: 2000
  drift_recent_window: 500
  mutual_information_bins: 20
runtime:
  prediction_poll_seconds: 2
  retrain_every_new_rounds: 500
  diagnostics_every_new_rounds: 100
  model_path: ./models/pingpong_ensemble.joblib
  metrics_path: ./models/pingpong_ensemble.metrics.json
api:
  host: 127.0.0.1
  port: 8010
dashboard:
  api_base_url: http://127.0.0.1:8010
  refresh_ms: 2000
  history_points: 300
transformer:
  enabled: false
  model_path: ./models/pingpong_transformer.pt
  sequence_length: 128
  d_model: 64
  nhead: 4
  num_layers: 3
  dim_feedforward: 192
  dropout: 0.1
  batch_size: 256
  epochs: 30
  learning_rate: 0.0005
  weight_decay: 0.0001
  patience: 5
  min_rounds: 20000
  device: auto
